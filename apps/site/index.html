    <meta name="color-scheme" content="dark" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Dark unless the visitor chose light before: applied before first paint, so the page never flashes.
      try { if (localStorage.getItem('talking-marble-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
    </script>

    <div id="root"></div>
    <noscript>
      <p>Talking Marble is an audio-reactive orb React component for voice AI apps. Install it with <code>npm i talking-marble</code>. The playground needs JavaScript; the docs are also at <a href="https://github.com/imjustinliao/Talking-Marble">github.com/imjustinliao/Talking-Marble</a>.</p>

    <script type="module" src="/src/home/main.tsx"></script>
