# Builds apps/site/ and deploys it to GitHub Pages (imjustinliao.github.io/Talking-Marble).
# Every push runs the checks and the build (CI). Deploying is gated: it runs only when the repository
# variable DEPLOY_PAGES is 'true' (Settings › Secrets and variables › Actions › Variables), which the
# owner sets once Settings › Pages › Source is GitHub Actions and they approve going live.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push does not cancel a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json › packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        run: pnpm typecheck && pnpm test
      - name: Build the package, then the site at /Talking-Marble/
        run: pnpm build
        env:
          GITHUB_PAGES: '1'
      - if: vars.DEPLOY_PAGES == 'true'
        uses: actions/configure-pages@v6
      - if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    # Only main may deploy, and only once the owner has turned deploying on (DEPLOY_PAGES).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
